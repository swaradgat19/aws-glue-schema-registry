syntax = "proto3";

package com.amazonaws.services.schemaregistry.tests.protobuf.performance;

message MediumMessage {
  string userId = 1;
  Profile profile = 2;
  int32 age = 3;
  bool active = 4;
  double score = 5;
  int64 loginCount = 6;
  string accountType = 7;
  string createdAt = 8;

  message Profile {
    string firstName = 1;
    string lastName = 2;
    string email = 3;
    string phone = 4;
  }
}
