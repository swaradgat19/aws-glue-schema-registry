# AWS Glue Schema Registry Performance Test Configuration
region=us-east-1
registry.name=performance-test-registry
dataFormat=JSON
schemaAutoRegistrationEnabled=true
timeToLiveMillis=300000
cacheSize=1000
compression=NONE

# Optional: Uncomment and set if you need specific endpoint
#endpoint=https://glue.us-east-1.amazonaws.com

# Optional: Uncomment if you need proxy settings
#proxyUrl=http://your-proxy-url:port
